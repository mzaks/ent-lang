<!doctype html>
<!-- The page of a program built with `ent build --web`: its window is the
     canvas, as big as the browser's tab (the window device makes it so,
     devices/window.c), and what it writes out is shown over its foot.
     On a touch screen, keys the program was built with (`ent build --web
     --touch-keys`) are drawn under it, or over its sides where the screen
     is wider than high; they press the program's keys.
     Emscripten puts the program's script where SCRIPT is. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ent</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16181d; }
  body { color: #c9ced6;
         font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { position: fixed; inset: 0; display: flex; align-items: center;
         justify-content: center; }
  /* (No scrolling, zooming or selecting by touch: touches are the
     program's.) */
  canvas { display: block; outline: none; background: #000;
           touch-action: none; user-select: none; -webkit-user-select: none;
           -webkit-touch-callout: none; }
  #status { position: fixed; top: 12px; left: 16px; pointer-events: none; }
  #status:empty { display: none; }
  #output { position: fixed; left: 0; right: 0; bottom: 0; max-height: 30vh;
            overflow: auto; margin: 0; padding: 8px 16px;
            white-space: pre-wrap; background: rgba(22, 24, 29, 0.85); }
  #output:empty { display: none; }
  #turn { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
          padding: 6px 12px; border-radius: 6px; pointer-events: none;
          background: rgba(22, 24, 29, 0.85); white-space: nowrap;
          font: 14px/1.4 system-ui, sans-serif; animation: fade 1s 5s forwards; }
  @keyframes fade { to { opacity: 0; } }
  body.keys #turn { bottom: calc(var(--pad) + 16px); }

  /* The keys of a touch screen: under the window (which the window device
     makes smaller by as much, devices/window.c), or over its sides. */
  #pad { position: fixed; left: 0; right: 0; bottom: 0; min-height: 96px;
         display: flex; align-items: center; justify-content: space-between;
         gap: 16px; box-sizing: border-box;
         padding: 8px max(16px, env(safe-area-inset-right))
                  max(8px, env(safe-area-inset-bottom))
                  max(16px, env(safe-area-inset-left));
         background: #101216; touch-action: none; user-select: none;
         -webkit-user-select: none; -webkit-touch-callout: none;
         font: 600 15px/1 system-ui, sans-serif; color: #d8dde6; }
  body.keys main { bottom: var(--pad); }
  @media (orientation: landscape) {
    body.keys main { bottom: 0; }
    #pad { background: none; pointer-events: none; }
    #pad > * { pointer-events: auto; opacity: 0.55; }
  }
  .cross { position: relative; width: 150px; height: 150px; flex: none;
           border-radius: 50%; background: #252a33; }
  .cross span { position: absolute; width: 50px; height: 50px; display: grid;
                place-items: center; border-radius: 12px; background: #333a46;
                font-size: 22px; }
  .cross span.on, .buttons span.on { background: #4b7bd8; color: #fff; }
  .cross .up { left: 50px; top: 4px; }
  .cross .down { left: 50px; bottom: 4px; }
  .cross .left { left: 4px; top: 50px; }
  .cross .right { right: 4px; top: 50px; }
  .buttons { display: flex; flex-wrap: wrap; justify-content: flex-end;
             align-content: flex-end; gap: 12px; margin-left: auto; max-width: 60%; }
  .buttons span { min-width: 64px; height: 64px; padding: 0 10px;
                  box-sizing: border-box; display: grid; place-items: center;
                  border-radius: 32px; background: #333a46; white-space: nowrap; }
  /* (Many keys: smaller, in as many rows as they take.) */
  .buttons.many { gap: 8px; }
  .buttons.many span { width: 58px; min-width: 0; height: 46px; padding: 0;
                       border-radius: 12px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
</main>
<div id="status">Loading…</div>
<pre id="output"></pre>
<div id="turn" hidden>Turn the phone sideways: more room</div>
<script>
  var statusLine = document.getElementById("status");
  var output = document.getElementById("output");
  var canvas = document.getElementById("canvas");
  var Module = {
    canvas: canvas,
    print: function (text) { output.textContent += text + "\n"; },
    printErr: function (text) { output.textContent += text + "\n"; },
    setStatus: function (text) { statusLine.textContent = text; },
    onRuntimeInitialized: function () { statusLine.textContent = ""; canvas.focus(); },
  };
  // (The keys go to the program wherever on the page one clicks.)
  document.addEventListener("click", function () { canvas.focus(); });
  window.onerror = function () { statusLine.textContent = "The program stopped: see below."; };

  // The keys of a touch screen (`ent build --web --touch-keys`), shown
  // where there is no mouse and a finger points: a phone or a tablet.
  // Each presses a key as the keyboard would (keydown, keyup, with the
  // keyCode the window library reads); a pad of four presses the one its
  // finger is towards, and another when the finger slides round.
  var entTouchKeys = [];
  (function () {
    if (!entTouchKeys.length ||
        !matchMedia("(hover: none) and (pointer: coarse)").matches)
      return;
    function key(given) {
      var name = given.split(":")[0], label = given.split(":")[1];
      var made = keyOf({ Up: "ArrowUp", Down: "ArrowDown", Left: "ArrowLeft",
                         Right: "ArrowRight" }[name] || name);
      if (label) made.label = label.replace(/_/g, " ");
      return made;
    }
    function keyOf(name) {
      var named = {
        Enter: [" Enter", "Enter", 13], Space: ["Space", " ", 32, "Space"],
        Escape: ["Esc", "Escape", 27], Tab: ["Tab", "Tab", 9],
        Shift: ["Shift", "Shift", 16, "ShiftLeft"],
        Backspace: ["\u232b", "Backspace", 8],
        ArrowUp: ["\u2191", "ArrowUp", 38], ArrowDown: ["\u2193", "ArrowDown", 40],
        ArrowLeft: ["\u2190", "ArrowLeft", 37], ArrowRight: ["\u2192", "ArrowRight", 39],
      }[name];
      if (named)
        return { label: named[0].trim(), key: named[1], keyCode: named[2],
                 code: named[3] || name };
      var digit = name >= "0" && name <= "9";
      return { label: name, key: name.toLowerCase(), keyCode: name.charCodeAt(0),
               code: (digit ? "Digit" : "Key") + name };
    }
    function send(k, down) {
      var e = new KeyboardEvent(down ? "keydown" : "keyup",
                                { key: k.key, code: k.code, bubbles: true, cancelable: true });
      Object.defineProperty(e, "keyCode", { get: function () { return k.keyCode; } });
      Object.defineProperty(e, "which", { get: function () { return k.keyCode; } });
      window.dispatchEvent(e);
    }
    var pad = document.createElement("div");
    pad.id = "pad";
    var buttons = document.createElement("div");
    buttons.className = "buttons";
    var cross = false;
    entTouchKeys.forEach(function (name) {
      if (name == "arrows" || name == "wasd") {
        if (cross) return;
        cross = true;
        var ways = name == "arrows"
          ? { up: "ArrowUp", left: "ArrowLeft", down: "ArrowDown", right: "ArrowRight" }
          : { up: "W", left: "A", down: "S", right: "D" };
        var box = document.createElement("div"), shown = {}, held = null;
        box.className = "cross";
        Object.keys(ways).forEach(function (way) {
          var span = document.createElement("span");
          span.className = way;
          ways[way] = key(ways[way]);
          span.textContent = ways[way].label;
          shown[way] = span;
          box.appendChild(span);
        });
        // (Towards which of the four the finger is, from the middle.)
        function hold(way) {
          if (way == held) return;
          if (held) { send(ways[held], false); shown[held].classList.remove("on"); }
          held = way;
          if (held) { send(ways[held], true); shown[held].classList.add("on"); }
        }
        function towards(e) {
          e.preventDefault();
          var touch = e.targetTouches[0];
          if (!touch) return hold(null);
          var r = box.getBoundingClientRect();
          var dx = touch.clientX - (r.left + r.width / 2);
          var dy = touch.clientY - (r.top + r.height / 2);
          if (dx * dx + dy * dy < 144) return hold(null);
          hold(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right")
                                           : (dy < 0 ? "up" : "down"));
        }
        ["touchstart", "touchmove", "touchend", "touchcancel"].forEach(function (n) {
          box.addEventListener(n, towards, { passive: false });
        });
        pad.appendChild(box);
        return;
      }
      var k = key(name), span = document.createElement("span");
      span.textContent = k.label;
      function press(down) {
        return function (e) {
          e.preventDefault();
          if (down == span.classList.contains("on")) return;
          span.classList.toggle("on", down);
          send(k, down);
        };
      }
      span.addEventListener("touchstart", press(true), { passive: false });
      span.addEventListener("touchend", press(false), { passive: false });
      span.addEventListener("touchcancel", press(false), { passive: false });
      buttons.appendChild(span);
    });
    if (buttons.children.length > 4) buttons.classList.add("many");
    pad.appendChild(buttons);
    document.body.appendChild(pad);
    document.body.classList.add("keys");
    // (The room under the window: as high as the keys are, in as many
    // rows as they take on this screen.)
    function room() {
      document.documentElement.style.setProperty("--pad", pad.offsetHeight + "px");
    }
    room();
    window.addEventListener("resize", room);
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
